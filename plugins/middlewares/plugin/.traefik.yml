displayName: Middlewares of Traefik
type: middleware
import: github.com/traefik/traefik/v3/plugins/middlewares/plugin
summary: The middlewares of Traefik other than chain, as one plugin.
implements:
  - addPrefix
  - stripPrefix
  - stripPrefixRegex
  - replacePath
  - replacePathRegex
  - ipWhiteList
  - ipAllowList
  - headers
  - encodedCharacters
  - errors
  - rateLimit
  - redirectRegex
  - redirectScheme
  - basicAuth
  - digestAuth
  - forwardAuth
  - inFlightReq
  - buffering
  - circuitBreaker
  - compress
  - passTLSClientCert
  - retry
  - contentType
  - grpcWeb
  - tap
  - requestHeaderModifier
  - responseHeaderModifier
  - requestRedirect
  - URLRewrite
  - authTLSPassCertificateToUpstream
  - snippet
  - rewriteTarget
  - upstreamVHost
  - appRoot
testData: {}
