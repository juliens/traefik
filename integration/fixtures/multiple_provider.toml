[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[api]
  insecure = true

[providers]
  [experimental.localPlugins.docker]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/docker"
    [experimental.localPlugins.docker.settings.goVM]
      trusted = true

  [providers.plugin.docker]
    watch = true
    exposedByDefault = false

  [experimental.localPlugins.file]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"
    [experimental.localPlugins.file.settings.goVM]
      trusted = true

  [providers.plugin.file]
    filename = "{{ .SelfFilename }}"

## dynamic configuration ##

[http.routers]
  [http.routers.router-1]
    service = "service-test"
    rule = "PathPrefix(`/file`)"

[http.services]
  [http.services.service-test.loadBalancer]
    [[http.services.service-test.loadBalancer.servers]]
      url = "http://{{ .IP }}"

[experimental.localPlugins.middlewares]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin"
  [experimental.localPlugins.middlewares.settings.goVM]
    trusted = true
