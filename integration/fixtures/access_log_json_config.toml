[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "ERROR"
  filePath = "traefik.log"

[accessLog]
  format = "json"
  filePath = "access.log"

[entryPoints]
  [entryPoints.web]
    address = ":8000"
  [entryPoints.frontendRedirect]
    address = ":8005"
  [entryPoints.httpFrontendAuth]
    address = ":8006"
  [entryPoints.httpRateLimit]
    address = ":8007"
  [entryPoints.digestAuth]
    address = ":8008"

[api]
  insecure = true

[providers]
  [experimental.localPlugins.docker]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/docker"

  [providers.docker]
    exposedByDefault = false
    defaultRule = "Host(`{{ normalize .Name }}.docker.local`)"
    watch = true

[experimental.localPlugins.basicauth]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/basicauth"

[experimental.localPlugins.digestauth]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/digestauth"

[experimental.localPlugins.headers]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/headers"

[experimental.localPlugins.ipallowlist]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/ipallowlist"

[experimental.localPlugins.ratelimit]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/ratelimit"

[experimental.localPlugins.redirectscheme]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/redirectscheme"
