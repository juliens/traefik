[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[api]
  insecure = true

[providers]
  [experimental.localPlugins.docker]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/docker"
    [experimental.localPlugins.docker.settings.goVM]
      trusted = true

  [providers.plugin.docker]
    endpoint = "{{ .DockerHost }}"
    defaultRule = "{{ .DefaultRule }}"
    exposedByDefault = false
