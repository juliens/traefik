[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.tcp]
    address = ":8093"

[api]
  insecure = true

[experimental.localPlugins.file]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"
  [experimental.localPlugins.file.settings.goVM]
    trusted = true

[providers.file]
  filename = "{{ .SelfFilename }}"

## dynamic configuration ##

[tcp]
  [tcp.routers]
    [tcp.routers.to-whoami-a]
      entryPoints = ["tcp"]
      rule = "HostSNI(`whoami-a.test`)"
      service = "whoami-a"
      middlewares = ["blocking-ipwhitelist"]
    [tcp.routers.to-whoami-a.tls]
      passthrough = true

    [tcp.routers.to-whoami-b]
      entryPoints = ["tcp"]
      rule = "HostSNI(`whoami-b.test`)"
      service = "whoami-b"
      middlewares = ["allowing-ipwhitelist"]
    [tcp.routers.to-whoami-b.tls]
      passthrough = true

  [tcp.services]
    [tcp.services.whoami-a.loadBalancer]
      [[tcp.services.whoami-a.loadBalancer.servers]]
        address = "{{ .WhoamiA }}"

    [tcp.services.whoami-b.loadBalancer]
      [[tcp.services.whoami-b.loadBalancer.servers]]
        address = "{{ .WhoamiB }}"

[tcp.middlewares]
  [tcp.middlewares.allowing-ipwhitelist.ipWhiteList]
    sourceRange = ["127.0.0.1/32"]
  [tcp.middlewares.blocking-ipwhitelist.ipWhiteList]
    sourceRange = ["127.127.127.127/32"]

[experimental.localPlugins.ipwhitelist]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/ipwhitelist"
  [experimental.localPlugins.ipwhitelist.settings.goVM]
    trusted = true
