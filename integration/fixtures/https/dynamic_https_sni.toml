[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.websecure]
     address = ":4443"

  [entryPoints.https02]
     address = ":8443"

[api]
  insecure = true

[providers]
  [experimental.localPlugins.file]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"

  [providers.file]
    fileName = "{{.DynamicConfFileName}}"
    watch = true
