[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"

[entryPoints]
  [entryPoints.websecure]
    address = ":4443"
    [entryPoints.websecure.http.tls]

  [entryPoints.websecure-options]
    address = ":4444"
    [entryPoints.websecure-options.http.tls]
      options = "foo"

[api]
  insecure = true

[experimental.localPlugins.file]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"
  [experimental.localPlugins.file.settings.goVM]
    trusted = true

[providers.plugin.file]
  filename = "{{ .SelfFilename }}"

## dynamic configuration ##

[http.routers]
  [http.routers.router1]
    entryPoints = ["websecure"]
    service = "service1"
    rule = "Host(`snitest.com`)"

  [http.routers.router2]
    entryPoints = ["websecure-options"]
    service = "service1"
    rule = "Host(`snitest.org`)"

[http.services]
  [http.services.service1]
    [http.services.service1.loadBalancer]
      [[http.services.service1.loadBalancer.servers]]
        url = "http://127.0.0.1:9010"

[[tls.certificates]]
  certFile = "fixtures/https/snitest.com.cert"
  keyFile = "fixtures/https/snitest.com.key"

[[tls.certificates]]
  certFile = "fixtures/https/snitest.org.cert"
  keyFile = "fixtures/https/snitest.org.key"

[tls.options]
  [tls.options.foo]
    maxVersion = "VersionTLS12"

[experimental.localPlugins.middlewares]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin"
  [experimental.localPlugins.middlewares.settings.goVM]
    trusted = true
