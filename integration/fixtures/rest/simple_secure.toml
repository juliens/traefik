[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[api]
  insecure = true

[experimental.localPlugins.rest]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/rest"

[providers.rest]

[experimental.localPlugins.file]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"

[providers.file]
  filename = "{{ .SelfFilename }}"

[http.routers.rest]
    rule="PathPrefix(`/secure`)"
    service="rest@internal"
    middlewares=["strip"]

[http.middlewares.strip.stripPrefix]
    prefixes = [ "/secure" ]
    

[experimental.localPlugins.stripprefix]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/stripprefix"
