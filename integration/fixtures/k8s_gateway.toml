[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[api]
  insecure = true

[experimental]
  kubernetesGateway = true

[entryPoints]
  [entryPoints.footlspassthrough]
    address = ":9001"
  [entryPoints.footlsterminate]
    address = ":9002"
  [entryPoints.footcp]
    address = ":8193"
  [entryPoints.fooudp]
    address = ":8190/udp"
  [entryPoints.web]
    address = ":8180"
  [entryPoints.websecure]
    address = ":8443"

[experimental.localPlugins.kubernetesGateway]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/kubernetes/gateway"
  [experimental.localPlugins.kubernetesGateway.settings.goVM]
    trusted = true

[providers.kubernetesGateway]

[experimental.localPlugins.stripprefix]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/stripprefix"
  [experimental.localPlugins.stripprefix.settings.goVM]
    trusted = true

[experimental.localPlugins.redirectregex]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/redirectregex"
  [experimental.localPlugins.redirectregex.settings.goVM]
    trusted = true
