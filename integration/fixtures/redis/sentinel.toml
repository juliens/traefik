[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"

[entryPoints.web]
  address = ":8000"

[api]
  insecure = true

[experimental.localPlugins.redis]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/kv/redis"
  [experimental.localPlugins.redis.settings.goVM]
    trusted = true

[providers.plugin.redis]
  rootKey = "traefik"
  endpoints = ["{{ .RedisAddress }}"]

[providers.plugin.redis.sentinel]
  masterName = "mymaster"

[experimental.localPlugins.middlewares]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin"
  [experimental.localPlugins.middlewares.settings.goVM]
    trusted = true
