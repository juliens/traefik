[entryPoints]
  [entryPoints.web]
    address = ":8000"
    [entryPoints.web.forwardedHeaders]
      insecure = true

[api]
  insecure = true

[experimental.localPlugins.file]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"

[providers.file]
  filename = "{{ .DynamicConfPath }}"
