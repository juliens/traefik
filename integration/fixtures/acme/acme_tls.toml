[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"

[entryPoints]
  [entryPoints.web]
    address = "{{ .PortHTTP }}"
  [entryPoints.websecure]
    address = "{{ .PortHTTPS }}"

{{range $name, $resolvers := .Acme }}

[experimental.localPlugins.{{ $name }}]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/acme"
  [experimental.localPlugins.{{ $name }}.settings.goVM]
    trusted = true

[providers.plugin.{{ $name }}]
  email = "test@traefik.io"
  storage = "/tmp/acme.json"
  keyType = "{{ $resolvers.ACME.KeyType }}"
  caServer = "{{ $resolvers.ACME.CAServer }}"

  {{if $resolvers.ACME.HTTPChallenge }}
  [providers.plugin.{{ $name }}.httpChallenge]
    entryPoint = "{{ $resolvers.ACME.HTTPChallenge.EntryPoint }}"
  {{end}}

  {{if $resolvers.ACME.TLSChallenge }}
  [providers.plugin.{{ $name }}.tlsChallenge]
  {{end}}

{{end}}

[api]
  insecure = true

[experimental.localPlugins.file]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"
  [experimental.localPlugins.file.settings.goVM]
    trusted = true

[providers.plugin.file]
  filename = "{{ .SelfFilename }}"

## dynamic configuration ##

[http.services]
  [http.services.test.loadBalancer]
    [[http.services.test.loadBalancer.servers]]
      url = "http://127.0.0.1:9010"

[http.routers]
  [http.routers.test]
    entryPoints = ["websecure"]
    rule = "Host(`traefik.acme.wtf`)"
    service = "test"
    [http.routers.test.tls]

[tls.stores]
  [tls.stores.default.defaultCertificate]
    certFile = "fixtures/acme/ssl/wildcard.crt"
    keyFile = "fixtures/acme/ssl/wildcard.key"

[experimental.localPlugins.middlewares]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin"
  [experimental.localPlugins.middlewares.settings.goVM]
    trusted = true
