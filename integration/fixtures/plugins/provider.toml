[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[providers.plugin.govmprovider]
  serverURL = "{{ .Server }}"

[experimental]
  [experimental.localPlugins.govmprovider]
    moduleName = "github.com/traefik/govmprovider"
