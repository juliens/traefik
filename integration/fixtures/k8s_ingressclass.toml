[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[api]
  insecure = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[experimental.localPlugins.kubernetesIngress]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/kubernetes/ingress"
  [experimental.localPlugins.kubernetesIngress.settings.goVM]
    trusted = true

[providers.plugin.kubernetesIngress]
  ingressClass = "traefik-keep"

[experimental.localPlugins.middlewares]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin"
  [experimental.localPlugins.middlewares.settings.goVM]
    trusted = true
