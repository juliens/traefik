[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.websecure]
    address = ":4443"
  [entryPoints.udp]
    address = ":4443/udp"

[api]
  insecure = true

[experimental.localPlugins.file]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"
  [experimental.localPlugins.file.settings.goVM]
    trusted = true

[providers.plugin.file]
  filename = "{{ .SelfFilename }}"

## dynamic configuration ##

[udp.routers]
  [udp.routers.router1]
    service = "service1"

  [udp.routers.router2]
    service = "service2"

[udp.services]
  [udp.services.service1]

  [udp.services.service2]
    [udp.services.service2.loadBalancer]
      [[udp.services.service2.loadBalancer.servers]]
        address = "127.0.0.1:9010"

[experimental.localPlugins.middlewares]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin"
  [experimental.localPlugins.middlewares.settings.goVM]
    trusted = true
