[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[api]
  insecure = true

[providers]
  [experimental.localPlugins.consulCatalog]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/consulcatalog"

  [providers.consulCatalog]
    exposedByDefault = true
    refreshInterval = "500ms"
    defaultRule = "{{ .DefaultRule }}"
  [providers.consulCatalog.endpoint]
    address = "{{ .ConsulAddress }}"
