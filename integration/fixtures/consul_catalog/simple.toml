[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[api]
  insecure = true

[providers]
  [experimental.localPlugins.consulCatalog]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/consulcatalog"
    [experimental.localPlugins.consulCatalog.settings.goVM]
      trusted = true

  [providers.plugin.consulCatalog]
    exposedByDefault = true
    refreshInterval = "500ms"
    defaultRule = "{{ .DefaultRule }}"
  [providers.plugin.consulCatalog.endpoint]
    address = "{{ .ConsulAddress }}"

[experimental.localPlugins.middlewares]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin"
  [experimental.localPlugins.middlewares.settings.goVM]
    trusted = true
