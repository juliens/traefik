[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[api]
  insecure = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[providers]
  [experimental.localPlugins.rest]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/rest"
    [experimental.localPlugins.rest.settings.goVM]
      trusted = true

  [providers.plugin.rest]
    insecure = true

  [experimental.localPlugins.file]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"
    [experimental.localPlugins.file.settings.goVM]
      trusted = true

  [providers.plugin.file]
    filename = "{{ .SelfFilename }}"

## dynamic configuration ##

[http.services]
    [http.services.service.loadBalancer]
      [[http.services.service.loadBalancer.servers]]
        url = "{{.Server}}"

[http.middlewares]
  [http.middlewares.customheader.headers.customRequestHeaders]
    X-Custom="CustomValue"

[experimental.localPlugins.headers]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/headers"
  [experimental.localPlugins.headers.settings.goVM]
    trusted = true

[experimental.localPlugins.ipallowlist]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/ipallowlist"
  [experimental.localPlugins.ipallowlist.settings.goVM]
    trusted = true

[experimental.localPlugins.ipwhitelist]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/ipwhitelist"
  [experimental.localPlugins.ipwhitelist.settings.goVM]
    trusted = true
