[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints.web]
  address = ":8000"

[api]
  insecure = true

[experimental.localPlugins.etcd]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/kv/etcd"
  [experimental.localPlugins.etcd.settings.goVM]
    trusted = true

[providers.plugin.etcd]
  rootKey = "traefik"
  endpoints = ["{{ .EtcdAddress }}"]

[experimental.localPlugins.compress]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/compress"
  [experimental.localPlugins.compress.settings.goVM]
    trusted = true

[experimental.localPlugins.redirectregex]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/redirectregex"
  [experimental.localPlugins.redirectregex.settings.goVM]
    trusted = true

[experimental.localPlugins.stripprefix]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/stripprefix"
  [experimental.localPlugins.stripprefix.settings.goVM]
    trusted = true
