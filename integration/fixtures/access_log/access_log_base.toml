[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "ERROR"
  filePath = "traefik.log"

[accessLog]
  filePath = "access.log"

[entryPoints]
  [entryPoints.web]
    address = ":8000"
  [entryPoints.frontendRedirect]
    address = ":8005"
  [entryPoints.httpFrontendAuth]
    address = ":8006"
  [entryPoints.httpRateLimit]
    address = ":8007"
  [entryPoints.digestAuth]
    address = ":8008"
  [entryPoints.preflight]
    address = ":8009"
  [entryPoints.ping]
    address = ":8010"

[api]
  insecure = true

[ping]

[metrics]
  [metrics.prometheus]

[providers]
  [experimental.localPlugins.docker]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/docker"
    [experimental.localPlugins.docker.settings.goVM]
      trusted = true

  [providers.plugin.docker]
    exposedByDefault = false
    defaultRule = "Host(`{{ normalize .Name }}.docker.local`)"
    watch = true

[experimental.localPlugins.middlewares]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin"
  [experimental.localPlugins.middlewares.settings.goVM]
    trusted = true
