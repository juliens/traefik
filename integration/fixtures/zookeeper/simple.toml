[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints.web]
  address = ":8000"

[api]
  insecure = true

[experimental.localPlugins.zookeeper]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/kv/zk"
  [experimental.localPlugins.zookeeper.settings.goVM]
    trusted = true

[providers.plugin.zookeeper]
  rootKey = "traefik"
  endpoints = ["{{ .ZkAddress }}"]

[experimental.localPlugins.middlewares]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin"
  [experimental.localPlugins.middlewares.settings.goVM]
    trusted = true
