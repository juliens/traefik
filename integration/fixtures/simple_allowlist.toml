[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"

[entryPoints]
  [entryPoints.web]
    address = ":8000"
    [entryPoints.web.ForwardedHeaders]
      insecure = true

[api]
  insecure = true

[providers]
  [experimental.localPlugins.docker]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/docker"
    [experimental.localPlugins.docker.settings.goVM]
      trusted = true

  [providers.docker]

[experimental.localPlugins.ipallowlist]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/ipallowlist"
  [experimental.localPlugins.ipallowlist.settings.goVM]
    trusted = true

[experimental.localPlugins.ipwhitelist]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/ipwhitelist"
  [experimental.localPlugins.ipwhitelist.settings.goVM]
    trusted = true
