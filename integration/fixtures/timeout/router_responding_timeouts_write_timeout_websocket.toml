[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[accessLog]
  format = "json"

[api]
  insecure = true

[experimental.localPlugins.file]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"
  [experimental.localPlugins.file.settings.goVM]
    trusted = true

[providers.file]
  filename = "{{ .SelfFilename }}"

## dynamic configuration ##

[http.routers]
  [http.routers.router-ws]
    service = "service-ws"
    rule = "Path(`/ws`)"
    [http.routers.router-ws.respondingTimeouts]
      writeTimeout = "1s"

[http.services]
  [http.services.service-ws]
    [http.services.service-ws.loadBalancer]
      [[http.services.service-ws.loadBalancer.servers]]
        url = "{{ .WebsocketServer }}"
