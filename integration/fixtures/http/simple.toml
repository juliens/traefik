[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"
  [entryPoints.traefik]
    address = ":9090"

[api]
  insecure = true

[providers]
  [experimental.localPlugins.http]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/http"
    [experimental.localPlugins.http.settings.goVM]
      trusted = true

  [providers.plugin.http]
    endpoint = "http://127.0.0.1:9000"
    pollInterval = "100ms"

[experimental.localPlugins.middlewares]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin"
  [experimental.localPlugins.middlewares.settings.goVM]
    trusted = true
