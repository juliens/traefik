[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"
  [entryPoints.traefik]
    address = ":9090"

[api]
  insecure = true

[providers]
  [experimental.localPlugins.http]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/http"

  [providers.http]
    endpoint = "http://127.0.0.1:9000"
    pollInterval = "100ms"
