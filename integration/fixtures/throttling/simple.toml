[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[api]
  insecure = true

[providers]
  providersThrottleDuration = "400ms"
  [experimental.localPlugins.rest]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/rest"
    [experimental.localPlugins.rest.settings.goVM]
      trusted = true

  [providers.rest]
    insecure = true

[metrics]
  addInternals = true
  [metrics.prometheus]
    buckets = [0.1,0.3,1.2,5.0]
