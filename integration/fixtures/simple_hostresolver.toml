[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[api]
  insecure = true

[providers]
  [experimental.localPlugins.docker]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/docker"
    [experimental.localPlugins.docker.settings.goVM]
      trusted = true

  [providers.docker]
    exposedByDefault = false
    defaultRule = "Host(`{{ normalize .Name }}.docker.local`)"
    watch = true

[hostResolver]
  cnameFlattening = true
