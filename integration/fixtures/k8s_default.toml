[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[api]
  insecure = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[experimental.localPlugins.kubernetesIngress]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/kubernetes/ingress"
  [experimental.localPlugins.kubernetesIngress.settings.goVM]
    trusted = true

[providers.kubernetesIngress]
  allowEmptyServices = true

[experimental.localPlugins.stripprefix]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/stripprefix"
  [experimental.localPlugins.stripprefix.settings.goVM]
    trusted = true

[experimental.localPlugins.redirectregex]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/redirectregex"
  [experimental.localPlugins.redirectregex.settings.goVM]
    trusted = true
