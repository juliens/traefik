[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[api]
  insecure = true

[providers]
  precedence = {{ .Precedence }}

  [experimental.localPlugins.file]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"
    [experimental.localPlugins.file.settings.goVM]
      trusted = true

  [providers.plugin.file]
    filename = "{{ .SelfFilename }}"

  [experimental.localPlugins.docker]
    moduleName = "github.com/traefik/traefik/v3/plugins/providers/docker"
    [experimental.localPlugins.docker.settings.goVM]
      trusted = true

  [providers.plugin.docker]
    endpoint = "{{ .DockerHost }}"
    exposedByDefault = false

## dynamic configuration ##

[http.routers]
  [http.routers.file-router]
    rule = "PathPrefix(`/http`)"
    service = "file-service"
    entryPoints = ["web"]

[http.services]
  [http.services.file-service.loadBalancer]
    [[http.services.file-service.loadBalancer.servers]]
      url = "http://{{ .FileBackendAddress }}"

[tcp.routers]
  [tcp.routers.file-router]
    rule = "HostSNI(`*`)"
    service = "file-service"
    entryPoints = ["web"]

[tcp.services]
  [tcp.services.file-service.loadBalancer]
    [[tcp.services.file-service.loadBalancer.servers]]
      address = "{{ .FileBackendAddress }}"

[experimental.localPlugins.ipallowlist]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/ipallowlist"
  [experimental.localPlugins.ipallowlist.settings.goVM]
    trusted = true

[experimental.localPlugins.ipwhitelist]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin/ipwhitelist"
  [experimental.localPlugins.ipwhitelist.settings.goVM]
    trusted = true
