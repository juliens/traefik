[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[api]

[entryPoints]
  [entryPoints.footcp]
    address = ":8093"
  [entryPoints.fooudp]
    address = ":8090/udp"
  [entryPoints.web]
    address = ":8000"

[experimental.localPlugins.kubernetesCRD]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/kubernetes/crd"
  [experimental.localPlugins.kubernetesCRD.settings.goVM]
    trusted = true

[providers.plugin.kubernetesCRD]
  allowCrossNamespace = false
  allowExternalNameServices = true

[experimental.localPlugins.middlewares]
  moduleName = "github.com/traefik/traefik/v3/plugins/middlewares/plugin"
  [experimental.localPlugins.middlewares.settings.goVM]
    trusted = true
