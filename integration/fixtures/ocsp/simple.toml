[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[experimental.localPlugins.file]
  moduleName = "github.com/traefik/traefik/v3/plugins/providers/file"
  [experimental.localPlugins.file.settings.goVM]
    trusted = true

[providers.plugin.file]
  filename = "{{ .SelfFilename }}"

[ocsp.responderOverrides]
  ocsp.example.com = "{{ .ResponderURL }}"

[log]
  level="debug"

## dynamic configuration ##

[[tls.certificates]]
  certFile = "fixtures/ocsp/server.crt"
  keyFile = "fixtures/ocsp/server.key"

[tls.stores]
  [tls.stores.default.defaultCertificate]
    certFile = "fixtures/ocsp/default.crt"
    keyFile = "fixtures/ocsp/default.key"
