---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: prefix
  namespace: default

spec:
  ingressClassName: nginx
  rules:
    - host: exact.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80

---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: exact
  namespace: default

spec:
  ingressClassName: nginx
  rules:
    - host: exact.localhost
      http:
        paths:
          - path: /exact
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80

