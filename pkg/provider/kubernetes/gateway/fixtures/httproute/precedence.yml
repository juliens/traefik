# The longest Prefix path match before header matches.
---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: longest-long
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - longest.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /abc
      backendRefs:
        - name: whoami
          port: 80

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: longest-header
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - longest.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /a
          headers:
            - name: h1
