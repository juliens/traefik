---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Same

# An Exact path match before a Prefix path match.
---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: exact-prefix
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - exact.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: exact-exact
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - exact.example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /x
      backendRefs:
        - name: whoami
          port: 80

# The Prefix path match with the largest number of characters first.
---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: prefix-short
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - prefix.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /a
      backendRefs:
        - name: whoami
          port: 80

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: prefix-long
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - prefix.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /a/b
      backendRefs:
        - name: whoami
          port: 80

# A method match before header matches.
---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: method-method
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - method.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /m
          method: GET
      backendRefs:
        - name: whoami
          port: 80

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: method-headers
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - method.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /m
          headers:
            - name: h1
              value: v
            - name: h2
              value: v
      backendRefs:
        - name: whoami
          port: 80

# The largest number of header matches first.
---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: headers-one
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
