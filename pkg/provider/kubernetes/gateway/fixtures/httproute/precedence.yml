          port: 80

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: headers-two
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - headers.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /h
          headers:
            - name: h1
