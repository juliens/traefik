# Within an HTTPRoute, the first matching rule.
---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: rules
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - rules.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /r
          headers:
            - name: h1
              value: v
      backendRefs:
        - name: whoami
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /r
          headers:
            - name: h2
              value: v
      backendRefs:
        - name: whoami
          port: 80

# Across HTTPRoutes, the oldest one, named so that the alphabetical order designates the other one.
---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: age-z-old
  namespace: default
  creationTimestamp: "2020-01-01T00:00:00Z"
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - age.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /t
          headers:
            - name: h1
              value: v
      backendRefs:
        - name: whoami
          port: 80

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: age-a-new
  namespace: default
  creationTimestamp: "2024-01-01T00:00:00Z"
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - age.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /t
          headers:
            - name: h2
              value: v
      backendRefs:
        - name: whoami
          port: 80

# A matching non-wildcard hostname before any path match.
